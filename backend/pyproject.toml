[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dentalcare-api"
version = "0.1.0"
description = "Multi-tenant dental clinic management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "redis>=5.2,<6",
  "celery[redis]>=5.4,<6",
  "structlog>=25,<26",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
dentalcare = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
