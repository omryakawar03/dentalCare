{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "microservice-showcase.fullname" . }}-backend
  labels:
    {{- include "microservice-showcase.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "microservice-showcase.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
{{- end }}

